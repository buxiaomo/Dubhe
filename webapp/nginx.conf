user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;
worker_rlimit_nofile 51200;

events {
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '{"time_local": "$time_local",'
                    '"server": "$host",'
                    '"dest_port": $server_port,'
                    '"dest_ip": "$server_addr",'
                    '"src": "$remote_addr",'
                    '"src_ip": "$realip_remote_addr",'
                    '"user": "$remote_user",'
                    '"site": "$server_name",'
                    '"protocol": "$server_protocol",'
                    '"status": $status,'
                    '"bytes_out": $bytes_sent,'
                    '"bytes_in": $upstream_bytes_received,'
                    '"http_referer": "$http_referer",'
                    '"http_user_agent": "$http_user_agent",'
                    '"nginx_version": $nginx_version,'
                    '"http_x_forwarded_for": "$http_x_forwarded_for",'
                    '"http_x_header": "$http_x_header",'
                    '"uri_query": "$query_string",'
                    '"uri_path": "$uri",'
                    '"http_method": "$request_method",'
                    '"response_time": $upstream_response_time,'
                    '"cookie": "$http_cookie",'
                    '"request": "$request",'
                    '"request_body": "$request_body",'
                    '"upstream_addr": "$upstream_addr",'
                    '"upstream_status": "$upstream_status",'
                    '"upstream_response_time": $upstream_response_time,'
                    '"upstream_bytes_received": $upstream_bytes_received,'
                    '"ssl_protocol": "$ssl_protocol",'
                    '"request_time":$request_time}';

    access_log /var/log/nginx/access.log main;

    server_names_hash_bucket_size 128;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    client_max_body_size 50m;

    sendfile   on;
    tcp_nopush on;

    keepalive_timeout 60;

    tcp_nodelay on;

    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 4 64k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_temp_file_write_size 256k;

    gzip on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types     text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/xml+rss;
    gzip_vary on;
    gzip_proxied   expired no-cache no-store private auth;
    gzip_disable   "MSIE [1-6]\.";

    server_tokens off;

    map $http_upgrade $connection_upgrade { 
        default          keep-alive;  #默认为keep-alive 可以支持 一般http请求
        'websocket'      upgrade;     #如果为websocket 则为 upgrade 可升级的。
    }

    server {
        listen       80;
        server_name  _;
        client_max_body_size 10240m;
        charset utf-8;

        proxy_buffer_size 1024k;
        proxy_buffers 16 1024k;
        proxy_busy_buffers_size 2048k;
        proxy_temp_file_write_size 2048k;

        proxy_connect_timeout  1800s;
        proxy_send_timeout  1800s;
        proxy_read_timeout  1800s;

        add_header Access-Control-Allow-Origin *;

        location ^~/model_measure/  {
            add_header Access-Control-Allow-Origin *;
            proxy_set_header Host $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_pass http://backend-model-measure:8821;
        }

        location ^~/nacos/  {
            add_header Access-Control-Allow-Origin *;
            proxy_set_header Host $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_pass http://nacos:8848;
        }

        location ^~/ws/  {
            proxy_http_version 1.1;
            proxy_read_timeout 360s;   
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://backend-k8s:8960;
        }

        location ^~/minio/  {
            add_header Access-Control-Allow-Origin *;
            proxy_set_header Host $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_pass http://minio:9000;
        }

        location /api/v1/ {
            proxy_pass http://backend-gateway:8800;
        }

        location /visual/api {
            proxy_pass http://backend-gateway:8800;
        }

        location ^~/dcm4chee/  {
            proxy_set_header Host $host;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_pass http://backend-dcm4chee:8080/;  # dcm服务地址
        }

        location / {
            root   /usr/share/nginx/html; # dist 文件夹根目录
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
